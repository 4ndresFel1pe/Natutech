# Conjunto completo de Natutech: base de datos, API y prototipo web.
#
#   1. cp .env.example .env      (y llene los valores; .env nunca se sube)
#   2. docker compose up --build
#   3. Abra http://localhost:8080  (la API queda en http://localhost:8080/api)
#
# Al arrancar, la API aplica las migraciones, carga los datos de ejemplo (si
# SEMBRAR_DATOS_EJEMPLO=si) y crea el administrador inicial. No hay pasos manuales.
# Los valores salen de .env; si falta uno obligatorio, Compose se detiene y dice cuál.
name: natutech

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # Solo para desarrollo (npm run dev, npm test): la base queda en el puerto 5432 de
    # este computador y únicamente para él (127.0.0.1), no para la red.
    ports:
      - "127.0.0.1:${DB_PUERTO_LOCAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: servidor/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRETO: ${JWT_SECRETO:?Falta JWT_SECRETO en .env. Genere uno con openssl rand -hex 32}
      JWT_EXPIRA_EN: ${JWT_EXPIRA_EN:-8h}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:8080,http://127.0.0.1:8080}
      SEMBRAR_DATOS_EJEMPLO: ${SEMBRAR_DATOS_EJEMPLO:-si}
      HORAS_ENTRE_ALERTAS: ${HORAS_ENTRE_ALERTAS:-6}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administración del vivero}
      ADMIN_CORREO: ${ADMIN_CORREO:?Falta ADMIN_CORREO en .env}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Falta ADMIN_CONTRASENA en .env}
    # Sin "ports": la API solo es visible dentro de la red de Compose; se llega a
    # ella por el servicio web (http://localhost:8080/api).

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PUERTO:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  datos_postgres:
