# Publica el prototipo (carpeta web/) en GitHub Pages cada vez que cambia en main,
# junto con la documentación navegable de la API generada desde api/openapi.yaml.
# GitHub Pages, cuando publica desde una rama, solo acepta la raíz o /docs;
# por eso la carpeta web/ se publica con este flujo (ver docs/decisiones.md, D9).
name: Publicar prototipo

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Instalar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # La página no se guarda en el repositorio: se genera aquí, en cada publicación,
      # para que siempre coincida con el contrato.
      - name: Generar la documentación de la API
        run: npx --yes @redocly/cli@2 build-docs api/openapi.yaml --output web/documentacion-api.html

      - name: Empaquetar la carpeta web
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5
