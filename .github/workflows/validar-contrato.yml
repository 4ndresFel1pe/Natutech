# Valida api/openapi.yaml en cada pull request y en cada cambio en main.
# Redocly revisa la sintaxis de OpenAPI 3.1 y que cada ejemplo cumpla su esquema.
name: Validar contrato OpenAPI

on:
  pull_request:
    paths:
      - "api/**"
      - ".redocly.lint-ignore.yaml"
      - ".github/workflows/validar-contrato.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".redocly.lint-ignore.yaml"
      - ".github/workflows/validar-contrato.yml"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validar el contrato con Redocly
        run: npx --yes @redocly/cli@2 lint api/openapi.yaml --format=github-actions
