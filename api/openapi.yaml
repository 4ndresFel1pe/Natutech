    post:
      tags: [Pedidos]
      operationId: crearPedido
      summary: Registra un pedido cerrado por WhatsApp o en la tienda
      description: |
        El precio de cada línea se copia del producto en el momento de crear el pedido
        (`precio_unitario`), así una subida de precio posterior no cambia pedidos viejos.
        El `total` lo calcula el servidor. Crear el pedido descuenta el stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoEntrada'
            examples:
              encargoDifuntos:
                summary: Encargo para el Día de los Difuntos
                value:
                  cliente_nombre: Luz Marina Pérez
                  cliente_telefono: +57 300 000 2201
                  canal: whatsapp
                  fecha_entrega: '2026-10-31'
                  nota: Arreglo para llevar al cementerio el 1 de noviembre. Recoge en el vivero.
                  detalles:
                    - producto_id: 3da94211-90a8-48a3-b787-059be5559766
                      cantidad: 6
                    - producto_id: d1d37c83-b213-4a63-80f9-1ecf63628ff7
                      cantidad: 2
      responses:
        '201':
          description: Pedido registrado
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
              examples:
                registrado:
                  $ref: '#/components/examples/PedidoDifuntos'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          description: El pedido no se puede registrar así
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sinStock:
                  summary: Se piden más unidades de las que hay
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: No hay stock suficiente para registrar el pedido.
                    detalles:
                      - campo: detalles[1].cantidad
