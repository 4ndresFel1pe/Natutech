components:
  securitySchemes:
    tokenJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token que entrega `POST /sesiones`. Se envía en la cabecera `Authorization: Bearer <token>`.'

  parameters:
    ProductoId:
      name: producto_id
      in: path
      required: true
      description: Identificador del producto.
      schema:
        type: string
        format: uuid
      example: 3da94211-90a8-48a3-b787-059be5559766
    Busqueda:
      name: q
      in: query
      description: Texto a buscar en el nombre común o científico.
      schema:
        type: string
        minLength: 2
        maxLength: 60
      example: palma
    FiltroCategoria:
      name: categoria_id
      in: query
      description: Solo productos de esta categoría.
      schema:
        type: string
        format: uuid
      example: d75df7ee-5c1f-4a9f-9213-5cb13ccc38b7
    Pagina:
      name: pagina
      in: query
      description: Número de página, empezando en 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PorPagina:
      name: por_pagina
      in: query
      description: Cantidad de elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      example: 12

  headers:
    Location:
      description: Ruta del recurso recién creado.
      schema:
        type: string
      example: /productos/13f6a1e7-b124-4c1b-9d3f-578cede15ff1

  responses:
    SolicitudInvalida:
      description: La petición está mal formada (JSON inválido, parámetro con tipo equivocado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            parametroMalo:
              summary: Página con un valor no permitido
              value:
                codigo: SOLICITUD_INVALIDA
                mensaje: El parámetro «pagina» debe ser un número entero mayor o igual a 1.
                detalles:
                  - campo: pagina
                    problema: se recibió «cero»
    NoAutenticado:
      description: Falta el token o ya venció
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            sinToken:
              summary: Petición sin token
              value:
                codigo: NO_AUTENTICADO
                mensaje: Inicie sesión para usar esta operación.
    NoEncontrado:
      description: No existe un recurso con ese identificador
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noExiste:
              summary: Identificador que no está en la base de datos
              value:
                codigo: NO_ENCONTRADO
                mensaje: No existe un registro con el identificador 00000000-0000-4000-8000-000000000000.
    ValidacionFallida:
      description: El JSON está bien formado pero algún valor no cumple las reglas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            precioNegativo:
              summary: Precio negativo y nombre vacío
              value:
                codigo: VALIDACION_FALLIDA
                mensaje: Revise los campos marcados.
                detalles:
                  - campo: precio
                    problema: debe ser un número entero mayor o igual a 0
                  - campo: nombre
                    problema: es obligatorio

