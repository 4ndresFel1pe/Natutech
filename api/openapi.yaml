        mensaje:
          type: string
          description: Explicación en español, lista para mostrarle a la persona.
        detalles:
          type: array
          description: Un elemento por cada campo con problema.
          items:
            type: object
            required: [campo, problema]
            properties:
              campo:
                type: string
              problema:
                type: string

    Paginacion:
      type: object
      required: [pagina, por_pagina, total]
      properties:
        pagina:
          type: integer
          minimum: 1
        por_pagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
          description: Total de elementos que cumplen el filtro, en todas las páginas.

    Uuid:
      type: string
      format: uuid
      readOnly: true

    Marca:
      type: string
      format: date-time
      readOnly: true

    Luz:
      type: [string, 'null']
      enum: [baja, media, alta, null]
      description: Luz que necesita la planta. Nulo en macetas e insumos.

    Cuidado:
      type: [string, 'null']
      enum: [facil, intermedio, avanzado, null]
      description: Dificultad de cuidado. Nulo en macetas e insumos.

    Telefono:
      type: string
      pattern: '^\+57 \d{3} \d{3} \d{4}$'
      description: Número colombiano con indicativo, en el formato +57 300 000 0000.

    EstadoPedido:
      type: string
      enum: [pendiente, confirmado, entregado, cancelado]

    EstadoAlerta:
      type: string
      enum: [activa, atendida, descartada]

    TipoAlerta:
      type: string
      enum: [stock_minimo, temporada]

    Categoria:
      type: object
      required: [id, nombre, descripcion, creado_en, actualizado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          minLength: 2
          maxLength: 40
        descripcion:
          type: [string, 'null']
          maxLength: 200
        creado_en:
          $ref: '#/components/schemas/Marca'
        actualizado_en:
          $ref: '#/components/schemas/Marca'

    ProductoPublico:
      type: object
      description: Proyección del producto para el catálogo público. No incluye proveedor, stock mínimo ni datos de control.
      required: [id, categoria_id, nombre, nombre_cientifico, descripcion, presentacion, precio, stock, luz, riego, cuidado, imagen_url]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        categoria_id:
          type: string
          format: uuid
        nombre:
          type: string
        nombre_cientifico:
          type: [string, 'null']
        descripcion:
          type: [string, 'null']
        presentacion:
          type: string
        precio:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        luz:
          $ref: '#/components/schemas/Luz'
        riego:
          type: [string, 'null']
        cuidado:
          $ref: '#/components/schemas/Cuidado'
        imagen_url:
          type: [string, 'null']

    ProductoCampos:
      type: object
      description: Campos de un producto que el personal puede diligenciar. Base de las demás variantes.
      properties:
        categoria_id:
          type: string
          format: uuid
        proveedor_id:
          type: [string, 'null']
          format: uuid
        nombre:
          type: string
          minLength: 2
          maxLength: 80
        nombre_cientifico:
          type: [string, 'null']
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 600
        presentacion:
          type: string
          minLength: 2
          maxLength: 60
          description: Tamaño o empaque en que se vende (matera de 20 cm, bulto de 25 kg...).
        precio:
          type: integer
          minimum: 0
          maximum: 5000000
          description: Precio de venta en pesos colombianos, sin decimales.
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        stock_minimo:
          type: integer
          minimum: 0
          maximum: 10000
          default: 5
          description: Por debajo de este número se genera una alerta de reabastecimiento.
        luz:
          $ref: '#/components/schemas/Luz'
        riego:
          type: [string, 'null']
          maxLength: 60
        cuidado:
          $ref: '#/components/schemas/Cuidado'
        imagen_url:
          type: [string, 'null']
          format: uri-reference
          maxLength: 300
        visible_en_catalogo:
          type: boolean
          default: true

    ProductoEntrada:
      description: Lo que se envía para crear un producto. Rechaza campos desconocidos.
      allOf:
        - $ref: '#/components/schemas/ProductoCampos'
      required: [categoria_id, nombre, presentacion, precio, stock, stock_minimo]
      unevaluatedProperties: false

    ProductoCambios:
      description: Lo que se envía para editar un producto. Todos los campos son opcionales, pero debe venir al menos uno.
      allOf:
        - $ref: '#/components/schemas/ProductoCampos'
      minProperties: 1
      unevaluatedProperties: false

    Producto:
      description: Producto completo, como lo ve el personal del vivero.
      allOf:
        - $ref: '#/components/schemas/ProductoCampos'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            creado_en:
              $ref: '#/components/schemas/Marca'
            actualizado_en:
              $ref: '#/components/schemas/Marca'
      required: [id, categoria_id, proveedor_id, nombre, nombre_cientifico, descripcion, presentacion, precio, stock, stock_minimo, luz, riego, cuidado, imagen_url, visible_en_catalogo, creado_en, actualizado_en]
      unevaluatedProperties: false

    PaginaProductosPublicos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ProductoPublico'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    PaginaProductos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Producto'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    ProveedorCampos:
      type: object
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 80
        telefono:
          $ref: '#/components/schemas/Telefono'
        municipio:
          type: string
          minLength: 3
          maxLength: 60
        suministra:
          type: [string, 'null']
          maxLength: 120
          description: Qué le vende al vivero.
        dias_entrega:
          type: integer
          minimum: 0
          maximum: 60
          default: 3
          description: Días que tarda en llegar un pedido a Yopal.
        activo:
          type: boolean
          default: true

    ProveedorEntrada:
      allOf:
        - $ref: '#/components/schemas/ProveedorCampos'
      required: [nombre, telefono, municipio]
      unevaluatedProperties: false

    ProveedorCambios:
      allOf:
        - $ref: '#/components/schemas/ProveedorCampos'
      minProperties: 1
      unevaluatedProperties: false

    Proveedor:
      allOf:
        - $ref: '#/components/schemas/ProveedorCampos'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            creado_en:
              $ref: '#/components/schemas/Marca'
            actualizado_en:
              $ref: '#/components/schemas/Marca'
      required: [id, nombre, telefono, municipio, suministra, dias_entrega, activo, creado_en, actualizado_en]
      unevaluatedProperties: false

    DetallePedidoEntrada:
      type: object
      required: [producto_id, cantidad]
      additionalProperties: false
      properties:
        producto_id:
          type: string
          format: uuid
        cantidad:
          type: integer
          minimum: 1
          maximum: 1000

    DetallePedido:
      type: object
      description: Una línea del pedido. El precio queda congelado al momento de registrarlo.
      required: [id, pedido_id, producto_id, cantidad, precio_unitario, creado_en, actualizado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        pedido_id:
          type: string
          format: uuid
          readOnly: true
        producto_id:
          type: string
          format: uuid
        cantidad:
          type: integer
          minimum: 1
          maximum: 1000
        precio_unitario:
          type: integer
          minimum: 0
          readOnly: true
        creado_en:
          $ref: '#/components/schemas/Marca'
        actualizado_en:
          $ref: '#/components/schemas/Marca'

    PedidoEntrada:
      type: object
      required: [cliente_nombre, cliente_telefono, detalles]
      additionalProperties: false
      properties:
        cliente_nombre:
          type: string
          minLength: 2
          maxLength: 80
        cliente_telefono:
          $ref: '#/components/schemas/Telefono'
        canal:
          type: string
          enum: [whatsapp, tienda]
          default: whatsapp
          description: Por dónde se cerró la venta.
        fecha_entrega:
          type: [string, 'null']
          format: date
          description: Solo para encargos con fecha (por ejemplo, el 31 de octubre).
        nota:
          type: [string, 'null']
          maxLength: 300
        detalles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/DetallePedidoEntrada'

    PedidoCambios:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        fecha_entrega:
          type: [string, 'null']
          format: date
        nota:
          type: [string, 'null']
          maxLength: 300

    Pedido:
      type: object
      required: [id, cliente_nombre, cliente_telefono, canal, estado, fecha_entrega, nota, total, detalles, creado_en, actualizado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        cliente_nombre:
          type: string
        cliente_telefono:
          $ref: '#/components/schemas/Telefono'
        canal:
          type: string
          enum: [whatsapp, tienda]
        estado:
          $ref: '#/components/schemas/EstadoPedido'
        fecha_entrega:
          type: [string, 'null']
          format: date
        nota:
          type: [string, 'null']
        total:
          type: integer
          minimum: 0
          readOnly: true
          description: Suma de cantidad × precio_unitario de todas las líneas. Lo calcula el servidor.
        detalles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DetallePedido'
        creado_en:
          $ref: '#/components/schemas/Marca'
        actualizado_en:
          $ref: '#/components/schemas/Marca'

    PaginaPedidos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    TemporadaCampos:
      type: object
      properties:
        nombre:
          type: string
          minLength: 3
          maxLength: 60
        fecha:
          type: string
          format: date
        dias_anticipacion:
          type: integer
          minimum: 1
          maximum: 90
          default: 21
          description: Cuántos días antes de la fecha se empiezan a revisar las existencias.

    TemporadaEntrada:
      allOf:
        - $ref: '#/components/schemas/TemporadaCampos'
      required: [nombre, fecha]
      unevaluatedProperties: false

    Temporada:
      allOf:
        - $ref: '#/components/schemas/TemporadaCampos'
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            creado_en:
              $ref: '#/components/schemas/Marca'
            actualizado_en:
              $ref: '#/components/schemas/Marca'
      required: [id, nombre, fecha, dias_anticipacion, creado_en, actualizado_en]
      unevaluatedProperties: false

    Alerta:
      type: object
      required: [id, producto_id, temporada_id, tipo, stock_actual, demanda_estimada, estado, creado_en, actualizado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        producto_id:
          type: string
          format: uuid
        temporada_id:
          type: [string, 'null']
          format: uuid
          description: Solo en alertas de tipo temporada.
        tipo:
          $ref: '#/components/schemas/TipoAlerta'
        stock_actual:
          type: integer
          minimum: 0
          description: Stock del producto cuando se generó la alerta.
        demanda_estimada:
          type: [integer, 'null']
          minimum: 0
          description: Unidades vendidas en la misma ventana de la temporada del año anterior. Nulo en alertas de stock mínimo.
        estado:
          $ref: '#/components/schemas/EstadoAlerta'
        creado_en:
          $ref: '#/components/schemas/Marca'
        actualizado_en:
          $ref: '#/components/schemas/Marca'

    AlertaCambios:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [atendida, descartada]

    Credenciales:
      type: object
      required: [correo, contrasena]
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
          maxLength: 120
        contrasena:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Nunca se guarda tal cual; el servidor guarda solo su hash bcrypt (72 bytes es el límite de bcrypt).

    Usuario:
      type: object
      description: Persona del vivero que usa el panel. El hash de la contraseña nunca sale de la API.
      required: [id, nombre, correo, rol, activo, creado_en, actualizado_en]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
          maxLength: 80
        correo:
          type: string
          format: email
        rol:
          type: string
          enum: [administrador, empleado]
        activo:
          type: boolean
        creado_en:
          $ref: '#/components/schemas/Marca'
        actualizado_en:
          $ref: '#/components/schemas/Marca'

    Sesion:
      type: object
      description: Respuesta del inicio de sesión. No se guarda en la base de datos (el JWT no tiene estado en el servidor).
      required: [token, expira_en, usuario]
      properties:
        token:
          type: string
        expira_en:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/Usuario'
