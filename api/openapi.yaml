openapi: 3.1.0

info:
  title: API de Natutech para el Vivero Las Acacias
  version: 0.2.0
  summary: Catálogo, inventario, pedidos y alertas de reabastecimiento por temporada.
  description: |
    Contrato de la API que implementará el backend en la Entrega 3.

    - El catálogo público (`/catalogo/...` y `/categorias`) no pide sesión.
    - Todo lo demás exige un token JWT que se obtiene en `POST /sesiones`.
    - Los precios son pesos colombianos (COP) en números enteros, sin decimales.
    - Las fechas con hora usan ISO 8601 con zona horaria de Colombia (`-05:00`).
    - Todos los errores tienen la misma forma: el esquema `Error`.

    Los datos de los ejemplos son sintéticos y realistas para un vivero de Yopal, Casanare.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:4010
    description: Servidor simulado (Prism) levantado desde este contrato
  - url: http://127.0.0.1:3000
    description: Backend local del equipo (desde la Entrega 3)

tags:
  - name: Catálogo público
    description: Lo que ve cualquier cliente sin iniciar sesión.
  - name: Categorías
    description: Agrupaciones del catálogo (interior, exterior, frutales, insumos...).
  - name: Productos
    description: Gestión del inventario por parte del personal del vivero.
  - name: Proveedores
    description: Quién le surte cada producto al vivero y en cuántos días.
  - name: Pedidos
    description: Encargos y ventas que el personal registra después de cerrar la venta por WhatsApp o en la tienda.
  - name: Temporadas
    description: Fechas de alta demanda (Día de la Madre, Amor y Amistad, Día de los Difuntos, Navidad).
  - name: Alertas
    description: Avisos de reabastecimiento por stock mínimo o por temporada cercana.
  - name: Sesiones
    description: Inicio de sesión del personal del vivero.

security:
  - tokenJwt: []

paths:
  /catalogo/productos:
    get:
      tags: [Catálogo público]
      operationId: listarCatalogo
      summary: Lista los productos visibles en el catálogo público
      description: |
        Solo devuelve productos con `visible_en_catalogo = true`. No expone proveedor,
        stock mínimo ni datos internos. Se usa en la pantalla principal del prototipo.
      security: []
      parameters:
        - $ref: '#/components/parameters/Busqueda'
        - $ref: '#/components/parameters/FiltroCategoria'
        - name: luz
          in: query
          description: Filtra por la luz que necesita la planta.
          schema:
            type: string
            enum: [baja, media, alta]
          example: media
        - name: solo_disponibles
          in: query
          description: Si es `true`, excluye los productos con stock en cero.
          schema:
            type: boolean
            default: false
          example: true
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de productos del catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProductosPublicos'
              examples:
                plantasDeInterior:
                  summary: Plantas de interior, primera página
                  value:
                    datos:
                      - id: 43562f72-bf9b-4438-bf98-f1bb8c9e51d5
                        categoria_id: d75df7ee-5c1f-4a9f-9213-5cb13ccc38b7
                        nombre: Monstera deliciosa
                        nombre_cientifico: Monstera deliciosa
                        descripcion: Hojas grandes y perforadas que se abren a medida que la planta crece. Aguanta bien el calor de Yopal si no le da el sol directo de la tarde.
                        presentacion: Matera plástica de 25 cm, 60 cm de alto
                        precio: 45000
                        stock: 12
                        luz: media
                        riego: 2 veces por semana
                        cuidado: facil
                        imagen_url: img/interior.svg
                      - id: d1d37c83-b213-4a63-80f9-1ecf63628ff7
                        categoria_id: d75df7ee-5c1f-4a9f-9213-5cb13ccc38b7
                        nombre: Espatifilo (cuna de Moisés)
                        nombre_cientifico: Spathiphyllum wallisii
                        descripcion: Flor blanca que se pide mucho para arreglos del Día de los Difuntos.
                        presentacion: Matera de 18 cm
                        precio: 35000
                        stock: 6
                        luz: baja
                        riego: 2 veces por semana
                        cuidado: facil
                        imagen_url: img/interior.svg
                    paginacion:
                      pagina: 1
                      por_pagina: 12
                      total: 6
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

  /catalogo/productos/{producto_id}:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Catálogo público]
      operationId: verProductoCatalogo
      summary: Muestra el detalle público de un producto
      security: []
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoPublico'
              examples:
                crisantemo:
                  summary: Crisantemo para el Día de los Difuntos
                  value:
                    id: 3da94211-90a8-48a3-b787-059be5559766
                    categoria_id: a1cc719d-b705-4664-9417-07dc8770f0b6
                    nombre: Crisantemo amarillo en matera
                    nombre_cientifico: Chrysanthemum morifolium
                    descripcion: La flor que más se vende para el Día de los Difuntos. Se puede llevar en matera o sembrar después en el jardín.
                    presentacion: Matera de 14 cm
                    precio: 15000
                    stock: 14
                    luz: alta
                    riego: Día de por medio
                    cuidado: facil
                    imagen_url: img/exterior.svg
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /categorias:
    get:
      tags: [Categorías]
      operationId: listarCategorias
      summary: Lista las categorías del catálogo
      description: Público, porque el catálogo las usa para filtrar. Son pocas, así que no se paginan.
      security: []
      responses:
        '200':
          description: Todas las categorías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
              examples:
                categorias:
                  summary: Dos de las siete categorías
                  value:
                    - id: d75df7ee-5c1f-4a9f-9213-5cb13ccc38b7
                      nombre: Interior
                      descripcion: Plantas que viven bien bajo techo, con luz indirecta.
                      creado_en: '2026-08-04T09:00:00-05:00'
                      actualizado_en: '2026-08-04T09:00:00-05:00'
                    - id: ad000eac-13f3-49c0-bbb0-d683c286c20e
                      nombre: Frutales
                      descripcion: Árboles frutales injertados para patio y finca.
                      creado_en: '2026-08-04T09:00:00-05:00'
                      actualizado_en: '2026-08-04T09:00:00-05:00'

  /productos:
    get:
      tags: [Productos]
      operationId: listarProductos
      summary: Lista el inventario completo
      description: Incluye productos ocultos del catálogo, stock mínimo y proveedor.
      parameters:
        - $ref: '#/components/parameters/Busqueda'
        - $ref: '#/components/parameters/FiltroCategoria'
        - name: bajo_stock
          in: query
          description: Si es `true`, solo devuelve productos con `stock` menor que `stock_minimo`.
          schema:
            type: boolean
            default: false
          example: true
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página del inventario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProductos'
              examples:
                bajoStock:
                  summary: Productos por debajo del stock mínimo
                  value:
                    datos:
                      - id: 1f491554-7cdd-48dd-a438-47ce97802716
                        categoria_id: d75df7ee-5c1f-4a9f-9213-5cb13ccc38b7
                        proveedor_id: 44856780-e256-4e4b-9091-3a1f31064483
                        nombre: Anturio rojo
                        nombre_cientifico: Anthurium andraeanum
                        descripcion: Flor roja y brillante que dura varias semanas. Prefiere humedad alta y sombra; el sol directo le quema las hojas.
                        presentacion: Matera de 15 cm, con 2 flores
                        precio: 38000
                        stock: 3
                        stock_minimo: 5
                        luz: media
                        riego: Cada 3 días
                        cuidado: intermedio
                        imagen_url: img/interior.svg
                        visible_en_catalogo: true
                        creado_en: '2026-08-04T09:00:00-05:00'
                        actualizado_en: '2026-09-28T17:40:00-05:00'
                    paginacion:
                      pagina: 1
                      por_pagina: 20
                      total: 4
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Productos]
      operationId: crearProducto
      summary: Crea un producto en el inventario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoEntrada'
            examples:
              helecho:
                summary: Helecho Boston que llegó del proveedor de Aguazul
                value:
                  categoria_id: 302f0ae0-2661-4dfe-9963-5f3e1fc4be40
                  proveedor_id: 44856780-e256-4e4b-9091-3a1f31064483
                  nombre: Helecho Boston
                  nombre_cientifico: Nephrolepis exaltata
                  descripcion: Helecho de hojas largas y arqueadas para materas colgantes en corredores con sombra.
                  presentacion: Matera colgante de 20 cm
                  precio: 28000
                  stock: 10
                  stock_minimo: 4
                  luz: media
                  riego: Cada 2 días
                  cuidado: intermedio
                  imagen_url: img/colgantes.svg
                  visible_en_catalogo: true
      responses:
        '201':
          description: Producto creado
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              examples:
                helechoCreado:
                  summary: El helecho ya guardado, con su id y fechas
                  value:
                    id: 13f6a1e7-b124-4c1b-9d3f-578cede15ff1
                    categoria_id: 302f0ae0-2661-4dfe-9963-5f3e1fc4be40
                    proveedor_id: 44856780-e256-4e4b-9091-3a1f31064483
                    nombre: Helecho Boston
                    nombre_cientifico: Nephrolepis exaltata
                    descripcion: Helecho de hojas largas y arqueadas para materas colgantes en corredores con sombra.
                    presentacion: Matera colgante de 20 cm
                    precio: 28000
                    stock: 10
                    stock_minimo: 4
                    luz: media
                    riego: Cada 2 días
                    cuidado: intermedio
                    imagen_url: img/colgantes.svg
                    visible_en_catalogo: true
                    creado_en: '2026-10-01T08:20:00-05:00'
                    actualizado_en: '2026-10-01T08:20:00-05:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          description: Ya existe un producto con ese nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nombreRepetido:
                  summary: Nombre duplicado
                  value:
                    codigo: CONFLICTO
                    mensaje: Ya existe un producto llamado «Helecho Boston». Edite ese producto en lugar de crear otro.
                    detalles:
                      - campo: nombre
                        problema: ya está en uso
        '422':
          $ref: '#/components/responses/ValidacionFallida'

  /productos/{producto_id}:
    parameters:
      - $ref: '#/components/parameters/ProductoId'
    get:
      tags: [Productos]
      operationId: verProducto
      summary: Muestra un producto con todos sus campos
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              examples:
                anturio:
                  $ref: '#/components/examples/ProductoAnturio'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [Productos]
      operationId: actualizarProducto
      summary: Cambia uno o varios campos de un producto
      description: |
        Solo se envían los campos que cambian. Es la operación que más se usa en
        temporada: el vivero sube precios y repone stock antes de cada fecha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoCambios'
            examples:
              subidaDeTemporada:
                summary: Precio de temporada y reposición antes del 2 de noviembre
                value:
                  precio: 17000
                  stock: 60
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              examples:
                crisantemoActualizado:
                  summary: Crisantemo con el precio y el stock nuevos
                  value:
                    id: 3da94211-90a8-48a3-b787-059be5559766
                    categoria_id: a1cc719d-b705-4664-9417-07dc8770f0b6
                    proveedor_id: 44856780-e256-4e4b-9091-3a1f31064483
                    nombre: Crisantemo amarillo en matera
                    nombre_cientifico: Chrysanthemum morifolium
                    descripcion: La flor que más se vende para el Día de los Difuntos. Se puede llevar en matera o sembrar después en el jardín.
                    presentacion: Matera de 14 cm
                    precio: 17000
                    stock: 60
                    stock_minimo: 10
                    luz: alta
                    riego: Día de por medio
                    cuidado: facil
                    imagen_url: img/exterior.svg
                    visible_en_catalogo: true
                    creado_en: '2026-08-04T09:00:00-05:00'
                    actualizado_en: '2026-10-01T09:05:00-05:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El nombre nuevo ya lo usa otro producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nombreRepetido:
                  summary: Nombre duplicado
                  value:
                    codigo: CONFLICTO
                    mensaje: Ya existe un producto llamado «Poto».
                    detalles:
                      - campo: nombre
                        problema: ya está en uso
        '422':
          $ref: '#/components/responses/ValidacionFallida'
    delete:
      tags: [Productos]
      operationId: eliminarProducto
      summary: Elimina un producto que nunca se ha vendido
      description: |
        Si el producto aparece en algún pedido no se elimina (se perdería el historial
        con el que se calculan las alertas de temporada). En ese caso se responde 409
        y se recomienda ocultarlo con `visible_en_catalogo = false`.
      responses:
        '204':
          description: Producto eliminado
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El producto tiene pedidos asociados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conPedidos:
                  summary: Producto con historial de ventas
                  value:
                    codigo: CONFLICTO
                    mensaje: El crisantemo aparece en 12 pedidos. Ocúltelo del catálogo en lugar de eliminarlo.
                    detalles:
                      - campo: visible_en_catalogo
                        problema: cambie este campo a false para retirarlo del catálogo

  /proveedores:
    get:
      tags: [Proveedores]
      operationId: listarProveedores
      summary: Lista los proveedores
      description: Son pocos (menos de veinte), así que no se paginan.
      responses:
        '200':
          description: Todos los proveedores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proveedor'
              examples:
                proveedores:
                  summary: Proveedores de plantas y de insumos
                  value:
                    - id: 44856780-e256-4e4b-9091-3a1f31064483
                      nombre: Cultivos Ornamentales El Morichal
                      telefono: +57 300 000 1101
                      municipio: Aguazul
                      suministra: Plantas ornamentales de interior y exterior
                      dias_entrega: 3
                      activo: true
                      creado_en: '2026-08-04T09:00:00-05:00'
                      actualizado_en: '2026-08-04T09:00:00-05:00'
                    - id: ce0bd65b-6406-427d-90c9-5e2c411bff12
                      nombre: Agroinsumos La Llanura
                      telefono: +57 300 000 1102
                      municipio: Yopal
                      suministra: Tierra, abonos y sustratos
                      dias_entrega: 1
                      activo: true
                      creado_en: '2026-08-04T09:00:00-05:00'
                      actualizado_en: '2026-08-04T09:00:00-05:00'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Proveedores]
      operationId: crearProveedor
      summary: Registra un proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProveedorEntrada'
            examples:
              materas:
                summary: Proveedor nuevo de materas plásticas
                value:
                  nombre: Plásticos del Casanare
                  telefono: +57 608 000 1105
                  municipio: Yopal
                  suministra: Materas plásticas y bandejas de germinación
                  dias_entrega: 2
                  activo: true
      responses:
        '201':
          description: Proveedor creado
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proveedor'
              examples:
                creado:
                  summary: Proveedor guardado
                  value:
                    id: db589bdd-1a84-4f0d-9549-49efe35fed0d
                    nombre: Plásticos del Casanare
                    telefono: +57 608 000 1105
                    municipio: Yopal
                    suministra: Materas plásticas y bandejas de germinación
                    dias_entrega: 2
                    activo: true
                    creado_en: '2026-10-01T10:00:00-05:00'
                    actualizado_en: '2026-10-01T10:00:00-05:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          description: Algún campo no cumple las reglas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                telefonoMalo:
                  summary: Teléfono sin indicativo
                  value:
                    codigo: VALIDACION_FALLIDA
                    mensaje: Revise los campos marcados.
                    detalles:
                      - campo: telefono
                        problema: use el formato +57 300 000 0000

  /proveedores/{proveedor_id}:
    parameters:
      - name: proveedor_id
        in: path
        required: true
        description: Identificador del proveedor.
        schema:
          type: string
          format: uuid
        example: 44856780-e256-4e4b-9091-3a1f31064483
    get:
      tags: [Proveedores]
      operationId: verProveedor
      summary: Muestra un proveedor
      responses:
        '200':
          description: Proveedor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proveedor'
              examples:
                morichal:
                  $ref: '#/components/examples/ProveedorMorichal'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags: [Proveedores]
      operationId: actualizarProveedor
      summary: Cambia uno o varios campos de un proveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProveedorCambios'
            examples:
              invierno:
                summary: En invierno la vía a Aguazul demora más las entregas
                value:
                  dias_entrega: 5
      responses:
        '200':
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proveedor'
              examples:
                actualizado:
                  summary: Proveedor con el nuevo tiempo de entrega
                  value:
                    id: 44856780-e256-4e4b-9091-3a1f31064483
                    nombre: Cultivos Ornamentales El Morichal
                    telefono: +57 300 000 1101
                    municipio: Aguazul
                    suministra: Plantas ornamentales de interior y exterior
                    dias_entrega: 5
                    activo: true
                    creado_en: '2026-08-04T09:00:00-05:00'
                    actualizado_en: '2026-10-01T10:30:00-05:00'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ValidacionFallida'

  /pedidos:
    get:
      tags: [Pedidos]
      operationId: listarPedidos
      summary: Lista los pedidos, del más reciente al más antiguo
      parameters:
        - name: estado
          in: query
          description: Filtra por estado del pedido.
          schema:
            $ref: '#/components/schemas/EstadoPedido'
          example: confirmado
        - name: desde
          in: query
          description: Fecha mínima de creación (inclusive).
          schema:
            type: string
            format: date
          example: '2026-09-01'
        - name: hasta
          in: query
          description: Fecha máxima de creación (inclusive).
          schema:
            type: string
            format: date
          example: '2026-09-30'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPedidos'
              examples:
                septiembre:
                  summary: Pedidos de finales de septiembre
                  value:
                    datos:
                      - id: fdec65fe-7212-4737-b222-d7283ab5a383
                        cliente_nombre: Luz Marina Pérez
                        cliente_telefono: +57 300 000 2201
                        canal: whatsapp
                        estado: confirmado
                        fecha_entrega: '2026-10-31'
                        nota: Arreglo para llevar al cementerio el 1 de noviembre. Recoge en el vivero.
                        total: 160000
                        detalles:
                          - id: 0a3bf4d9-c097-4e13-89a5-b1d8560d8297
                            pedido_id: fdec65fe-7212-4737-b222-d7283ab5a383
                            producto_id: 3da94211-90a8-48a3-b787-059be5559766
                            cantidad: 6
                            precio_unitario: 15000
