# Advertencias de Redocly aceptadas por el equipo, con su razón.
# GET /categorias y GET /temporadas son listas públicas sin parámetros, y GET /salud
# solo informa el estado del servicio: no hay una petición del cliente que pueda estar
# mal formada, así que no tienen una respuesta 4XX real.
api/openapi.yaml:
  operation-4xx-response:
    - '#/paths/~1categorias/get/responses'
    - '#/paths/~1temporadas/get/responses'
    - '#/paths/~1salud/get/responses'
